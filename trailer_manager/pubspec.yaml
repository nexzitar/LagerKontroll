name: trailer_manager
description: "Trailer management app for tracking storage and location"
publish_to: 'none'

version: 1.3.0+14

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.7

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # JSON Serialization
  json_annotation: ^4.9.0

  # Camera & Images
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  google_mlkit_text_recognition: ^0.13.0

  # Location & Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1

  # Updates (will be added via Shorebird CLI later)
  # shorebird_code_push: will be added when setting up Shorebird

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#e32d22"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml
